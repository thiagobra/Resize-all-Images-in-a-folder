[project]
name = "resize-all-images-in-a-folder"
version = "0.1.0"
description = "Batch-resize all JPEG and PNG images in a directory."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Thiago Augusto Braga" }]
keywords = ["images", "resize", "batch", "pillow"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "Pillow>=9.1",
    "tqdm>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "ruff>=0.1",
    "mypy>=1.0",
    "pre-commit>=3.0",
]

[project.urls]
Homepage = "https://github.com/thiagobra/Resize-all-Images-in-a-folder"
Issues = "https://github.com/thiagobra/Resize-all-Images-in-a-folder/issues"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = [
    "A002",  # 'format' shadows builtin (it's the standard Pillow kwarg name)
]

[tool.ruff.lint.per-file-ignores]
"python code to rezise it.py" = [
    "A002",  # 'format' is part of Pillow's API
]
